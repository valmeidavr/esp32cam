[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

upload_port   = COM3
monitor_port  = COM3
monitor_speed = 921600

board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0      ; a serial carrega bytes de imagem: nada de log nela
