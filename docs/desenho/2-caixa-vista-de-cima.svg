<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img" aria-label="A caixa tem quatro compartimentos: 1 círculo e 2 quadrado em cima, 3 triângulo e 4 estrela embaixo. A caçamba fica no centro, recebe a peça da esteira e é levada pelo braço dos servos até o compartimento.">
          <style>
:root{
    --bg: #f3f5f7;
    --panel: #ffffff;
    --fg: #17212b;
    --muted: #5b6875;
    --line: #9aa7b4;
    --dados: #1f6feb;      /* imagem e dados */
    --cmd: #d9640b;        /* comandos e movimento */
    --power: #c62828;      /* alimentação 5 V */
    --circulo: #cfe3ff;
    --quadrado: #ffe2c2;
    --triangulo: #d4f0d8;
    --estrela: #f7d4ef;
    --ink-on-tint: #17212b;
    --sans: system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
      --bg: #0f151b; --panel: #18212a; --fg: #e6edf3; --muted: #93a1af; --line: #5d6b79;
      --dados: #5aa2ff; --cmd: #ff9a4d; --power: #ff6b6b;
      --circulo: #1f3a5c; --quadrado: #5a3b1c; --triangulo: #1f4a2a; --estrela: #5a2a4f;
      --ink-on-tint: #e6edf3; color-scheme: dark;
    } }
svg{background:var(--panel)}
/* elementos do desenho */
  .caixa { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
  .forte { stroke: var(--fg); stroke-width: 2; }
  .t { fill: var(--fg); font-family: var(--sans); font-size: 13px; }
  .tb { fill: var(--fg); font-family: var(--sans); font-size: 14px; font-weight: 700; }
  .tm { fill: var(--muted); font-family: var(--sans); font-size: 12px; }
  .porta { fill: var(--fg); font-family: var(--mono); font-size: 12px; font-weight: 500; }
  .fio-d { stroke: var(--dados); stroke-width: 2.5; fill: none; }
  .fio-c { stroke: var(--cmd); stroke-width: 2.5; fill: none; }
  .fio-p { stroke: var(--power); stroke-width: 2.5; fill: none; }
  .fio-g { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .tracejado { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .peca { stroke: var(--fg); stroke-width: 1.5; }
  .cel1 { fill: var(--circulo); stroke: var(--line); }
  .cel2 { fill: var(--quadrado); stroke: var(--line); }
  .cel3 { fill: var(--triangulo); stroke: var(--line); }
  .cel4 { fill: var(--estrela); stroke: var(--line); }
  .num { fill: var(--ink-on-tint); font-family: var(--sans); font-size: 20px; font-weight: 700; }
  .nome { fill: var(--ink-on-tint); font-family: var(--sans); font-size: 13px; }

</style>
<defs>
            <marker id="seta-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--cmd)"/></marker>
            <marker id="seta-d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--dados)"/></marker>
          </defs>

          <rect class="cel1" x="200" y="50" width="178" height="118" rx="4"/>
          <rect class="cel2" x="382" y="50" width="178" height="118" rx="4"/>
          <rect class="cel3" x="200" y="172" width="178" height="118" rx="4"/>
          <rect class="cel4" x="382" y="172" width="178" height="118" rx="4"/>

          <text class="num" x="214" y="76">1</text>
          <circle class="peca" cx="268" cy="104" r="14" fill="none"/>
          <text class="nome" x="268" y="150" text-anchor="middle">círculo</text>

          <text class="num" x="546" y="76" text-anchor="end">2</text>
          <rect class="peca" x="450" y="90" width="28" height="28" fill="none"/>
          <text class="nome" x="464" y="150" text-anchor="middle">quadrado</text>

          <text class="num" x="214" y="198">3</text>
          <path class="peca" d="M254 242 L268 214 L282 242 z" fill="none"/>
          <text class="nome" x="268" y="272" text-anchor="middle">triângulo</text>

          <text class="num" x="546" y="198" text-anchor="end">4</text>
          <path class="peca" d="M464 212 L469 227 L485 227 L472 236 L477 251 L464 242 L451 251 L456 236 L443 227 L459 227 z" fill="none"/>
          <text class="nome" x="464" y="272" text-anchor="middle">estrela</text>

          <!-- peça chegando da esteira -->
          <rect class="caixa" x="330" y="2" width="100" height="26" rx="4"/>
          <text class="tm" x="380" y="19" text-anchor="middle">fim da esteira</text>
          <path class="fio-d" d="M380 28 V146" marker-end="url(#seta-d2)"/>
          <text class="tm" x="392" y="42">a peça cai</text>

          <!-- caçamba -->
          <ellipse cx="380" cy="170" rx="28" ry="17" fill="var(--panel)" stroke="var(--fg)" stroke-width="2"/>
          <text class="tm" x="380" y="174" text-anchor="middle">caçamba</text>

          <!-- caminhos para cada compartimento -->
          <path class="fio-c" d="M362 156 L338 130" marker-end="url(#seta-c2)"/>
          <path class="fio-c" d="M398 156 L422 130" marker-end="url(#seta-c2)"/>
          <path class="fio-c" d="M362 184 L338 210" marker-end="url(#seta-c2)"/>
          <path class="fio-c" d="M398 184 L422 210" marker-end="url(#seta-c2)"/>

          <!-- braço e servos -->
          <path d="M608 170 H408" stroke="var(--fg)" stroke-width="5" fill="none"/>
          <text class="tm" x="585" y="161" text-anchor="middle">braço</text>
          <rect class="caixa forte" x="610" y="110" width="120" height="120" rx="6"/>
          <text class="tb" x="670" y="146" text-anchor="middle">Servos</text>
          <text class="tm" x="670" y="168" text-anchor="middle">giro: escolhe</text>
          <text class="tm" x="670" y="184" text-anchor="middle">o compartimento</text>
          <text class="tm" x="670" y="204" text-anchor="middle">despejo: vira</text>
          <text class="tm" x="670" y="220" text-anchor="middle">a caçamba</text>
        </svg>