name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    # Windows de proposito: e onde o programa vai rodar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r testes/requirements-dev.txt
      - run: python -m pytest
